<aside class="admin-sidebar" [class.collapsed]="!isOpen">


  <!-- =========================================
       SIDEBAR TOP
  ========================================== -->

  <div class="sidebar-top">

    <div class="sidebar-section-title">
      <i class="bi bi-grid-fill"></i>
      MAIN MENU
    </div>


    <!-- Mobile Close -->
    <button class="mobile-close" type="button" (click)="closeSidebar()" aria-label="Close Sidebar">

      <i class="fa-solid fa-xmark"></i>

    </button>

  </div>


  <!-- =========================================
       MENU
  ========================================== -->

  <nav class="sidebar-menu">


    <!-- Dashboard -->

    <a routerLink="/AdminDashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-grid-1x2-fill"></i>
      </span>

      <span class="menu-text">
        Dashboard
      </span>

    </a>




    <!-- =====================================
         TRAVEL MANAGEMENT
    ====================================== -->

    <div class="menu-section">
      <i class="bi bi-airplane"></i>
      TRAVEL MANAGEMENT
    </div>


    <!-- Destinations -->

    <a routerLink="/AdminDashboard/Destinations" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-geo-alt"></i>
      </span>

      <span class="menu-text">
        Destinations
      </span>

    </a>


    <!-- Branch Services -->

    <a routerLink="/AdminDashboard/BranchService" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-building-gear"></i>
      </span>

      <span class="menu-text">
        BranchServices
      </span>

    </a>



    <a routerLink="/AdminDashboard/Inventory" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-box-seam"></i>
      </span>

      <span class="menu-text">
        Inventory
      </span>

    </a>


    <a routerLink="/AdminDashboard/AvailableTickets" routerLinkActive="active" class="menu-item"
      (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-ticket-perforated"></i>
      </span>

      <span class="menu-text">
        Available Tickets
      </span>

    </a>




    <a routerLink="/AdminDashboard/PendingHoldConfirmBookingsComponent" routerLinkActive="active" class="menu-item"
      (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-ticket-detailed"></i>
      </span>

      <span class="menu-text">
        Ticket Status Info
      </span>

    </a>




    <a routerLink="/AdminDashboard/CustomerLedgerComponent" routerLinkActive="active" class="menu-item"
      (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-journal-text"></i>
      </span>

      <span class="menu-text">
        Customers Booking Ledger
      </span>

    </a>




    <!-- // Full Ledger -->
    <a routerLink="/AdminDashboard/LedgerDetails" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">
      <span class="menu-icon">
        <i class="bi bi-journal-text"></i>
      </span>

      <span class="menu-text">
        Ledger Details
      </span>

    </a>
    

    <!-- =====================================
         CONTENT
    ====================================== -->

    <div class="menu-section">
      <i class="bi bi-grid"></i>
      CONTENT
    </div>


    <!-- Media -->



    <!-- Reviews -->

    <a routerLink="/admin/reviews" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
        <i class="bi bi-star"></i>
      </span>

      <span class="menu-text">
        Reviews
      </span>

    </a>


    <!-- =====================================
         SYSTEM
    ====================================== -->

    <div class="menu-section">
      <i class="bi bi-gear"></i>
      SYSTEM
    </div>


    <!-- Settings -->

    <a routerLink="/admin/settings" routerLinkActive="active" class="menu-item" (click)="onMenuClick()">

      <span class="menu-icon">
         <i class="bi bi-gear-fill"></i>
      </span>

      <span class="menu-text">
        Settings
      </span>

    </a>

  </nav>


  <!-- =========================================
       SIDEBAR BOTTOM
  ========================================== -->

  <div class="sidebar-bottom">


    <!-- Support -->

    <div class="support-card">

      <div class="support-icon">
        <i class="fa-solid fa-headset"></i>
      </div>

      <div class="support-content">

        <strong>
          Need Help?
        </strong>

        <span>
          Contact support
        </span>

      </div>

      <i class="fa-solid fa-chevron-right support-arrow"></i>

    </div>


    <!-- Desktop Collapse -->

    <div class="collapse-container">

      <span class="collapse-line"></span>

      <span>
        Sidebar
      </span>

    </div>

  </div>

</aside>
